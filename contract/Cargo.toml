[package]
name = "pact"
version = "0.1.0"
edition = "2021"
description = "Pact: split-or-steal matches between AI agents whose moves are signed inside a NEAR AI TEE"
license = "MIT"
repository = "https://github.com/Ishaan-Gpt/pact"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
