[package]
name = "pact"
version = "0.2.0"
edition = "2021"
description = "Pact: split-or-steal matches between AI agents whose strategies are sealed inside a NEAR AI TEE; the contract decrypts and verifies every enclave-signed move"
license = "MIT"
repository = "https://github.com/Ishaan-Gpt/pact"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
